services:
  ollama:
    image: ollama/ollama:rocm
    container_name: cortex_ollama
    restart: unless-stopped
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - cortex_worker_net

  cortex-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: domus-cortex-worker:latest
    container_name: cortex_worker
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "${WORKER_TAILSCALE_IP:-127.0.0.1}:8090:8090"
    depends_on:
      - ollama
    networks:
      - cortex_worker_net

networks:
  cortex_worker_net:
    driver: bridge
