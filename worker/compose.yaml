services:
  ollama:
    image: ollama/ollama:rocm
    container_name: cortex_ollama
    restart: unless-stopped
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - ./ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - cortex_worker_net

  cortex-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: domus-cortex-worker:latest
    container_name: cortex_worker
    restart: unless-stopped
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    volumes:
      - ./voice_models:/app/voice_models
    ports:
      - "${WORKER_TAILSCALE_IP:-127.0.0.1}:8090:8090"
    depends_on:
      - ollama
    networks:
      - cortex_worker_net

  domus-cortex-daemon:
    build:
      context: ${DAEMON_BUILD_CONTEXT:-../daemon}
      dockerfile: Dockerfile
    image: domus-cortex-daemon:latest
    container_name: domus_cortex_daemon
    restart: unless-stopped
    pid: "host"
    network_mode: "host"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  cortex_worker_net:
    driver: bridge
